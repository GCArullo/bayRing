# Example minimization run for the same setup as config_SXS_0305_Kerr_220_quick.ini.
#
# Run from the repository root with:
#
#   bayRing --config-file config_files/config_SXS_0305_Kerr_220_minimization.ini
#
# The accepted bayRing method value is `Minimization`.

[I/O]

outdir        = SXS_0305_Kerr_220_30M_const_error_minimization
screen-output = 1

[NR-data]

error = constant-0.0001

[Injection-data]

[Model]

template  = Kerr
QNM-modes = 220

[Inference]

method = Minimization

# These are the same time-domain settings used by the quick nested-sampler
# example, so the minimization result can be compared directly against it.
t-start    = 30.0
t-end      = 80.0
min-method = trf

# Number of random starting points. The first seed is the prior midpoint and
# the rest are drawn uniformly inside the configured prior bounds using `seed`.
n-random-seeds = 64
seed           = 1234

# Maximum scipy function evaluations for each starting point.
min-iter-max = 1000

[Priors]

# Optional user-controlled starting points can be set here, for example:
#
# ln_A_220-start = -0.03
# phi_220-start  = 1.62
#
# Optional tighter or wider bounds use the same syntax as nested-sampler runs:
#
# ln_A_220-min = -2.0
# ln_A_220-max = 2.0
