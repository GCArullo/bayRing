# Example linear-inversion run for the same setup as config_SXS_0305_Kerr_220_quick.ini.
#
# Run from the repository root with:
#
#   bayRing --config-file config_files/config_SXS_0305_Kerr_220_linear_inversion.ini
#
# Linear inversion directly solves the free complex Kerr amplitudes. Any
# non-linear parameters must be fixed in [Priors] or inferred with Minimization.

[I/O]

outdir        = SXS_0305_Kerr_223_0M_const_error_linear_inversion
screen-output = 1

[NR-data]

error = constant-0.0001

[Injection-data]

[Model]

template  = Kerr
QNM-modes = 220,221,222,223

[Inference]

method = Linear-inversion

# These are the same time-domain settings used by the quick nested-sampler
# and minimization examples, so point estimates can be compared directly.
t-start = 0.0
t-end   = 80.0

# Absolute floor applied to Fisher-matrix eigenvalues before inversion.
linear-inversion-eigenvalue-tol = 1e-10

[Priors]

# Leave ln_A_220 and phi_220 free so linear inversion solves the complex
# amplitude of the 220 Kerr mode.
